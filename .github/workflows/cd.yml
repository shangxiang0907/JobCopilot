name: CD

# Triggered only after the CI workflow completes successfully on main.
# This guarantees CD never runs on a red commit, even on direct pushes.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  # ── 1. Build & Push all images to ghcr.io ────────────────────────────────────
  build-push:
    name: Build & Push / ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      # Keyless signing: the runner exchanges this OIDC token for a short-lived
      # Fulcio certificate that records WHICH repo and workflow produced the
      # image. That provenance is the whole point — a signature from some other
      # workflow, or from a developer laptop, will not satisfy the deploy-time
      # verification in infra/scripts/remote-deploy.sh.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: profile
            dockerfile: services/profile/Dockerfile
            context: .
          - name: job
            dockerfile: services/job/Dockerfile
            context: .
          - name: discovery
            dockerfile: services/discovery/Dockerfile
            context: .
          - name: agent
            dockerfile: services/agent/Dockerfile
            context: .
          - name: notification
            dockerfile: services/notification/Dockerfile
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            build_args: "KONG_URL=http://kong:8000"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobcopilot-${{ matrix.service.name }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository_owner }}/jobcopilot-${{ matrix.service.name }}:latest
          # GIT_SHA is baked into every image (ENV) and mirrored as the standard
          # OCI revision label — /healthz, jobcopilot_build_info, and deploy.sh's
          # post-deploy verification all read the same value.
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            ${{ matrix.service.build_args }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Closes the one window digest pinning cannot: the deploy resolves the
      # <sha> TAG to a digest at deploy time, and a tag is mutable. Anyone who
      # can write to this registry could push a different image to that tag and
      # the deploy would faithfully resolve, pin and ship THEIR digest — with
      # Trivy having scanned ours. A signature is bound to the digest, so an
      # image we did not build cannot carry one.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign the image by digest
        env:
          # Sign the digest, never the tag: signing a tag would re-point along
          # with it and prove nothing.
          IMAGE: ghcr.io/${{ github.repository_owner }}/jobcopilot-${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          echo "Signed $IMAGE"

  # ── 1b. E2E smoke against the exact images just pushed ───────────────────────
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: build-push
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack from the just-built images
        working-directory: infra
        env:
          E2E_IMAGE_OWNER: ${{ github.repository_owner }}
          E2E_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          # .env.e2e, NOT .env.example — the latter is the production template
          # and would point the browser at the production Keycloak.
          cp .env.e2e .env
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up -d --no-build --quiet-pull

      - name: Wait for stack readiness
        working-directory: infra
        run: |
          # Keycloak realm + frontend up, and Kong answering 401 on a routed
          # /v1 path (proves gateway, route table, and JWT plugin are live).
          for i in $(seq 1 90); do
            kc=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/realms/jobcopilot || true)
            fe=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 || true)
            kong=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/applications || true)
            if [ "$kc" = "200" ] && [ "$fe" = "200" ] && [ "$kong" = "401" ]; then
              echo "Stack ready after ${i} polls"
              # The realm init one-shot must have finished (declares the
              # tenant_id user-profile attribute) before creating users.
              docker compose -f docker-compose.yml -f docker-compose.e2e.yml wait keycloak-init
              exit 0
            fi
            sleep 5
          done
          echo "Stack failed to become ready" >&2
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          exit 1

      - name: Create E2E test user
        run: ./infra/scripts/create-test-user.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Playwright smoke suite
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke

      # SAD ADR-008: the Core layer must be complete with the AI layer stopped.
      # This runs LAST because it leaves the stack degraded on purpose — the
      # suite's own first test fails if the Agent Service is still answering.
      - name: Stop the AI layer
        working-directory: infra
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml stop agent-service

      - name: Run Playwright no-AI suite
        working-directory: frontend
        run: npx playwright test --project=no-ai

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        working-directory: infra
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=80

  # ── 2. Trivy image scan — Critical CVE blocks the pipeline ───────────────────
  image-scan:
    name: Image Scan / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [profile, job, discovery, agent, notification, frontend]
    # Trivy's default DB order is mirror.gcr.io/aquasec -> ghcr.io/aquasecurity,
    # but it only falls back on TRANSIENT errors (429/5xx). A 404 from the GCR
    # mirror is not transient, so Trivy fails the job without ever trying GHCR
    # (seen on run 30409721180, attempt 1). Pin the chain explicitly: GHCR first
    # — the docker/login-action step below already authenticated us to it, so we
    # are not subject to anonymous pull limits — with ECR Public as the genuine
    # 429/5xx fallback. All four tags verified to resolve before pinning.
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.service }} for Critical CVEs (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/jobcopilot-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true

      - name: Report all CVEs including unfixed (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/jobcopilot-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false

  # ── 3. Deploy to production ───────────────────────────────────────────────────
  #
  # Gated twice over. The `production` GitHub Environment carries a required
  # reviewer, so nothing reaches the server until a human approves this run; and
  # the deploy key on the server is pinned to a forced command that accepts only
  # "deploy <40-hex-sha>", so approving cannot be parlayed into shell access.
  #
  # The deploy itself runs ON the server (infra/scripts/remote-deploy.sh, reached
  # through /usr/local/bin/jobcopilot-deploy) — the same entry point a hand-run
  # infra/scripts/deploy.sh uses, so the two paths cannot drift apart. That is
  # also why this job needs no checkout, no registry login and no production
  # secrets: the server already has its own infra/.env, installed by a human, and
  # CD has no way to read or replace it.
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [image-scan, e2e-smoke]
    # Explicit on-switch, set once the server side and the secrets are in place
    # (`gh variable set DEPLOY_ENABLED --body true`). Until then this job is
    # SKIPPED rather than failing on absent secrets — a pipeline that is red for
    # a known, intended reason trains everyone to ignore red. It doubles as the
    # kill switch: set it to anything else to stop deploying without reverting.
    # `secrets` is not available to a job-level `if`, so the gate is a variable
    # and the secrets themselves are checked in the first step below.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 20
    permissions: {}
    environment:
      name: production
      url: https://jobcopilot.arnoldshang.com
    steps:
      - name: Authorise the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS are not configured." >&2
            echo "See infra/scripts/jobcopilot-deploy for the one-time setup." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key matters more here than usual: every run starts on
          # a fresh runner, so trust-on-first-use would mean trusting a different
          # first connection every time — an open MITM window on each deploy.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy ${{ github.event.workflow_run.head_sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy ${SHA}"
